<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      const locationParts = window.location;
      const route = locationParts.pathname
        .slice(1)
        .split("&")
        .map((part) => part.replace(/&/g, "~and~"))
        .join("&");

      window.location.replace(
        `${locationParts.origin}/?/${route}${locationParts.search ? `&${locationParts.search.slice(1)}` : ""}${locationParts.hash}`,
      );
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
