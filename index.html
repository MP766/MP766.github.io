<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mark Perez's portfolio of software, tools, games, and technical projects."
    />
    <title>Mark Perez | Portfolio</title>
    <script>
      (function (location) {
        if (location.search.startsWith("?/")) {
          const route = location.search.slice(2).split("&").map((part) => part.replace(/~and~/g, "&")).join("?");
          window.history.replaceState(null, "", `/${route}${location.hash}`);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
